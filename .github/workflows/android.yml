name: Build Android APK
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # 加入 --org 參數，產生全新的應用程式 ID
      - run: flutter create --org com.newversion . --platforms android
      
      # 強制替換 Android 顯示名稱，加上 "(新版)" 方便區分
      - run: sed -i 's/android:label="[^"]*"/android:label="AI 營養顧問 (新版)"/g' android/app/src/main/AndroidManifest.xml
      
      - run: sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
      
      - run: flutter pub get
      
      - run: flutter pub run flutter_launcher_icons
      
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
