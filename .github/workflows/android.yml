name: Build Android APK
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - run: flutter create . --platforms android
      
      # [重點1]：強制替換 Android 顯示名稱，你可以把 "AI 營養顧問" 換成你想要的 App 名稱
      - run: sed -i 's/android:label="[^"]*"/android:label="AI 營養顧問"/g' android/app/src/main/AndroidManifest.xml
      
      - run: sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
      
      - run: flutter pub get
      
      # [重點2]：呼叫我們剛剛加入的套件，根據 icon.png 自動幫你裁切各種尺寸的 App 圖示
      - run: flutter pub run flutter_launcher_icons
      
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
